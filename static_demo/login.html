<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@100;200;300;400;500;600;700;800;900&family=Roboto+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Acceso - Clothing Store</title>
</head>
<body class="general">
    <div class="header">
        <div class="filter-bar">
            <i class="far fa-bars"></i>
        </div>
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>CLOTHING STORE</h1>
            </a>
        </div>
        <div class="button-container">
            <div id="search">
                <i class="far fa-search"></i>
            </div>
            <div id="user-info">
                <i class="far fa-user"></i>
            </div>
            <div id="shopping-bag">
                <i class="far fa-shopping-bag"></i>
            </div>
        </div>
    </div>
    
    <!-- Sidebar de categorías -->
    <aside id="sidebar" class="sidebar" style="margin-top: 70px;">
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html#camisas">CAMISAS</a></li>
            <li><a href="index.html#pantalones">PANTALONES</a></li>
            <li><a href="index.html#calzado">CALZADO</a></li>
            <li><a href="index.html#accesorios">ACCESORIOS</a></li>
        </ul>
    </aside>

    <!-- Overlay -->
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar" style="position: fixed; top: 0; right: -450px; left: auto !important; width: 450px; height: 100vh; background-color: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1001; display: flex; flex-direction: column;">
        <div class="sidebar-header" style="margin-top: 70px;">
            <h2>MI BOLSA</h2>
            <i class="fas fa-times close-btn" onclick="toggleCart()"></i>
        </div>
        
        <div id="cart-items" class="cart-items" style="flex: 1; overflow-y: auto; padding: 20px;">
            <!-- Los productos se agregarán aquí dinámicamente -->
        </div>
        
        <div class="cart-footer" style="border-top: 2px solid #e0e0e0; padding: 20px; background-color: #f9f9f9;">
            <div class="cart-total" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700;">
                <span>Total:</span>
                <span id="cart-total-amount">$0.00</span>
            </div>
            <div class="cart-checkout-btn" onclick="proceedToCheckout()" style="width: 100%; padding: 15px 20px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; transition: background-color 0.3s; margin-bottom: 10px; text-align: center; background-color: #124a7e; color: white; border: none; box-sizing: border-box;">
                Proceder al Pago
            </div>
            <div class="cart-clear-btn" onclick="clearCart()" style="width: 100%; padding: 15px 20px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; transition: background-color 0.3s; margin-bottom: 10px; text-align: center; background-color: white; color: #575757; border: 1px solid #e0e0e0; box-sizing: border-box;">
                Vaciar Bolsa
            </div>
        </div>
    </div>

    <!-- Overlay para el carrito -->
    <div id="cart-overlay" class="overlay" onclick="toggleCart()"></div>
    
    <a href="index.html" class="back-button">
        <i class="fas fa-chevron-left"></i>
        <span>Volver a la tienda</span>
    </a>

    <div class="login-container">
        <div class="auth-box">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">INICIAR SESIÓN</button>
                <button class="auth-tab" onclick="switchTab('register')">CREAR CUENTA</button>
            </div>
            
            <!-- Formulario de Login -->
            <form id="login-form" class="auth-form" style="display: block;" onsubmit="handleLogin(event)">
                <h2>Bienvenido</h2>
                <p class="auth-subtitle">Accede a tu cuenta para una experiencia personalizada</p>
                
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            </form>
            
            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
                <h2>Crear Cuenta</h2>
                <p class="auth-subtitle">Únete a nuestra comunidad exclusiva</p>
                
                <div class="form-group">
                    <label for="register-nombre">Nombre Completo</label>
                    <input type="text" id="register-nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="register-email">Correo Electrónico</label>
                    <input type="email" id="register-email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="register-password">Contraseña</label>
                    <input type="password" id="register-password" name="password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="register-password-confirm">Confirmar Contraseña</label>
                    <input type="password" id="register-password-confirm" name="password_confirm" required minlength="6">
                </div>
                
                <label class="checkbox-label">
                    <input type="checkbox" required>
                    <span>Acepto los <a href="#">términos y condiciones</a></span>
                </label>
                
                <button type="submit" class="btn-primary">CREAR CUENTA</button>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.auth-tab');
            
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[1].classList.add('active');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            // Simulación de login exitoso
            alert('Función de login en desarrollo\n\nEn la versión con backend, aquí se validarían las credenciales contra la base de datos.');
            // window.location.href = 'index.html';
        }

        function handleRegister(event) {
            event.preventDefault();
            const nombre = document.getElementById('register-nombre').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            
            if (password !== passwordConfirm) {
                alert('Las contraseñas no coinciden');
                return;
            }
            
            if (password.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            // Simulación de registro exitoso
            alert('Cuenta creada exitosamente\n\nEn la versión con backend, aquí se crearía el usuario en la base de datos.');
            switchTab('login');
        }
    </script>
</body>
</html>
